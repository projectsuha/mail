name: Windows programı
on:
  push:
    branches: [desktop]
  workflow_dispatch:
# Varsayılan: sadece okuma. Yazma izni yalnızca son "yayınla" adımında.
permissions:
  contents: read
jobs:
  derle:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # depoya yazma anahtarı derleme sırasında diskte kalmasın
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Google masaüstü kimliği
        shell: bash
        env:
          CID: ${{ secrets.DESKTOP_CLIENT_ID }}
          CSEC: ${{ secrets.DESKTOP_CLIENT_SECRET }}
        run: node -e "require('fs').writeFileSync('auth-config.json', JSON.stringify({clientId:process.env.CID, clientSecret:process.env.CSEC}))"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-Kurulum
          path: desktop/dist/*.exe
  yayinla:
    needs: derle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mail-Kurulum
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: masaustu-${{ github.run_number }}
          name: Mail Windows programı (${{ github.run_number }})
          body: Mail-Kurulum dosyasını indirip çalıştır. Uyarı çıkarsa Ek bilgi → Yine de çalıştır.
          files: dist/*.exe
