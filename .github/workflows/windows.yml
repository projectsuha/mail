name: Pano Windows
on:
  workflow_dispatch:
  push:
    branches: [pano]
    paths: ['pano/**', 'main.js', 'preload.js', 'package.json', '.github/workflows/windows.yml']
permissions:
  contents: write
jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - name: Yayinla (Release)
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          gh release delete pano-son --yes --cleanup-tag 2>&1 | Out-Null
          gh release create pano-son "$($exe.FullName)" --target "$env:GITHUB_SHA" --title "Suha Pano (son derleme)" --notes "Otomatik Windows derlemesi. Imzasiz: SmartScreen cikarsa 'Daha fazla bilgi -> Yine de calistir'. Panolar bu cihazda (yerel) saklanir."
