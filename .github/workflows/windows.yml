name: Suha Mail Windows
on:
  workflow_dispatch:
  push:
    branches: [kabuk]
    paths: ['main.js', 'preload.js', 'imap-preload.js', 'renderer/**', 'imap/**', 'package.json', '.github/workflows/windows.yml']
permissions:
  contents: write
jobs:
  derle:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - name: Yayinla (Release)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          gh release delete kabuk-son --yes --cleanup-tag 2>&1 | Out-Null
          Start-Sleep -Seconds 6
          for ($i=0; $i -lt 4; $i++) {
            gh release create kabuk-son "$($exe.FullName)" --target "$env:GITHUB_SHA" --title "Suha Mail" --notes "Gmail, Yandex, Outlook (web) ve kendi IMAP motorumuz tek pencerede. Imzasiz: SmartScreen cikarsa 'Daha fazla bilgi -> Yine de calistir'."
            if ($LASTEXITCODE -eq 0) { break }
            gh release delete kabuk-son --yes --cleanup-tag 2>&1 | Out-Null
            Start-Sleep -Seconds 8
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
